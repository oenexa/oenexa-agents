groups:
  - name: oenexa-agents-alerts
    rules:
      - alert: ServiceDown
        expr: up{service=\"oenexa-agents\"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: \"oenexa-agents instance is down\"
          description: \"Pod for oenexa-agents has been down for more than 1 minute.\"
      - alert: High5xxRate
        expr: rate(http_requests_total{service=\"oenexa-agents\",status=~\"5..\"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: \"Elevated 5xx error rate on oenexa-agents\"